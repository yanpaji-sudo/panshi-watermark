<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>磐石水印相机 v6.0</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
padding:15px;
background:#111827;
font-family:
-apple-system,
BlinkMacSystemFont,
"Microsoft YaHei",
Arial;
color:#fff;
}


.app{
display:flex;
gap:15px;
height:95vh;
}


.panel{
width:330px;
background:#1f2937;
padding:15px;
border-radius:12px;
overflow:auto;
}


.preview{
flex:1;
background:#000;
border-radius:12px;
position:relative;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
}


canvas{
max-width:100%;
max-height:100%;
}



h2{
margin:0 0 15px;
}


input,button,select{

width:100%;
padding:10px;
margin-top:8px;
border-radius:8px;
border:1px solid #374151;
background:#111827;
color:#fff;

}



button{
background:#2563eb;
cursor:pointer;
}


button:hover{
background:#1d4ed8;
}


.green{
background:#16a34a;
}


.red{
background:#dc2626;
}




.search{
position:relative;
}



.list{

position:absolute;
top:100%;
left:0;
right:0;
background:#111827;
z-index:10;
border-radius:8px;
overflow:hidden;

}



.list div{

padding:10px;
border-bottom:1px solid #374151;
cursor:pointer;

}



.list div:hover{

background:#374151;

}



.row{

display:flex;
gap:8px;

}



.row input{

width:50%;

}





/* 专业水印样式 */

.watermark{

position:absolute;

left:25px;

bottom:25px;

color:white;

font-family:
"Microsoft YaHei";

text-shadow:
0 2px 5px rgba(0,0,0,.9);

line-height:1.25;

cursor:move;

white-space:pre-line;

font-size:16px;

}



</style>

</head>


<body>


<div class="app">


<div class="panel">


<h2>
磐石水印相机 v6.0
</h2>



<input 
type="file"
id="file"
accept="image/*"
capture="environment">





<div class="search">


<input
id="address"
placeholder="输入中国地址，例如：北京大红门">


<div id="list"
class="list">
</div>


</div>



<div class="row">

<input id="lat"
placeholder="纬度">

<input id="lon"
placeholder="经度">

</div>




<button
id="location"
class="green">
📍 获取当前位置
</button>



<input
id="weather"
placeholder="天气">


<input
id="temp"
placeholder="温度">



<button
id="getWeather">
☀ 获取天气
</button>



<button
id="export"
class="red">
📥 导出高清图片
</button>



</div>





<div class="preview">


<canvas id="canvas"></canvas>


<div
id="watermark"
class="watermark">
</div>


</div>



</div>





<script>


const file=
document.getElementById("file");


const canvas=
document.getElementById("canvas");


const ctx=
canvas.getContext("2d");



const address=
document.getElementById("address");


const lat=
document.getElementById("lat");


const lon=
document.getElementById("lon");


const list=
document.getElementById("list");


const watermark=
document.getElementById("watermark");



let img=null;



// 上传图片

file.onchange=function(e){


let f=e.target.files[0];


if(!f)return;



let reader=new FileReader();



reader.onload=function(ev){


img=new Image();



img.onload=function(){


canvas.width=img.width;

canvas.height=img.height;


draw();



};



img.src=ev.target.result;



};



reader.readAsDataURL(f);



};



function draw(){


if(!img)return;


ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);


ctx.drawImage(
img,
0,
0
);



}


// ===============================
// 中国地址搜索
// ===============================

let timer=null;


address.oninput=function(){


clearTimeout(timer);



let key=this.value.trim();



if(!key){

list.innerHTML="";

return;

}



timer=setTimeout(async()=>{



try{


/*
 使用高德地理编码接口格式
 这里使用公开代理服务，
 优先返回中国地址
*/


let url=
"https://nominatim.openstreetmap.org/search?format=json&accept-language=zh-CN&countrycodes=cn&limit=8&q="
+
encodeURIComponent(key);



let res=
await fetch(url);



let data=
await res.json();



list.innerHTML="";



data.forEach(item=>{


let div=
document.createElement("div");



let name=
item.display_name
.replace(/, China/g,"")
.replace(/, 中国/g,"");



div.innerText=name;



div.onclick=function(){


address.value=name;



lat.value=
Number(item.lat).toFixed(6);



lon.value=
Number(item.lon).toFixed(6);



list.innerHTML="";



updateWatermark();



};



list.appendChild(div);



});



}catch(e){


console.log(
"地址搜索失败",
e
);



}



},500);



};






// ===============================
// GPS定位
// ===============================


document.getElementById("location")
.onclick=function(){



if(!navigator.geolocation){


alert(
"浏览器不支持定位"
);


return;

}



navigator.geolocation.getCurrentPosition(

async function(pos){



lat.value=
pos.coords.latitude.toFixed(6);



lon.value=
pos.coords.longitude.toFixed(6);



/*
 根据坐标反查中国地址
*/


try{


let url=
"https://nominatim.openstreetmap.org/reverse?format=json&accept-language=zh-CN&lat="
+
lat.value
+
"&lon="
+
lon.value;



let res=
await fetch(url);



let data=
await res.json();



if(data.display_name){


address.value=
data.display_name
.replace(/, China/g,"")
.replace(/, 中国/g,"");


}



}catch(e){}



updateWatermark();



},



function(){


alert(
"定位失败，请开启定位权限"
);


}



);



};







// ===============================
// 天气
// ===============================


document.getElementById("getWeather")
.onclick=
async function(){



if(!lat.value||!lon.value){


alert(
"请先选择地址"
);


return;

}



try{


let url=

`https://api.open-meteo.com/v1/forecast?latitude=${lat.value}&longitude=${lon.value}&current=temperature_2m,wind_speed_10m`;



let res=
await fetch(url);



let data=
await res.json();




let t=
Math.round(
data.current.temperature_2m
);



let wind=
data.current.wind_speed_10m;



document.getElementById("temp").value=
t+"℃";



document.getElementById("weather").value=
"☀ 晴 风速"+wind+"m/s";



updateWatermark();



}catch(e){


document.getElementById("weather").value=
"天气获取失败";


}



};







// ===============================
// 水印文字生成
// ===============================


function updateWatermark(){


let d=
new Date();



let time=

d.getFullYear()
+
"-"
+
String(d.getMonth()+1).padStart(2,"0")
+
"-"
+
String(d.getDate()).padStart(2,"0")
+
" "
+
String(d.getHours()).padStart(2,"0")
+
":"
+
String(d.getMinutes()).padStart(2,"0");




watermark.innerText=


time

+

"\n\n📍 "

+

address.value

+

"\n"

+

lat.value

+

"°N "

+

lon.value

+

"°E"

+

"\n\n"

+

(document.getElementById("weather").value||"")
+

" "

+

(document.getElementById("temp").value||"")

+

"\n\n磐石水印相机";



}



setInterval(
updateWatermark,
1000
);
// ===============================
// 水印拖动（支持电脑+手机触摸）
// ===============================


let move=false;

let offsetX=0;

let offsetY=0;


function startMove(e){


move=true;



let point=
e.touches?
e.touches[0]:
e;



offsetX=
point.clientX-
watermark.offsetLeft;



offsetY=
point.clientY-
watermark.offsetTop;



watermark.style.bottom="auto";


}



function moving(e){


if(!move)return;



let point=
e.touches?
e.touches[0]:
e;



let x=
point.clientX-offsetX;



let y=
point.clientY-offsetY;



x=Math.max(0,x);

y=Math.max(0,y);



watermark.style.left=
x+"px";


watermark.style.top=
y+"px";



}



function stopMove(){


move=false;


}



watermark.addEventListener(
"mousedown",
startMove
);


document.addEventListener(
"mousemove",
moving
);


document.addEventListener(
"mouseup",
stopMove
);



watermark.addEventListener(
"touchstart",
startMove,
{
passive:true
}
);


document.addEventListener(
"touchmove",
moving,
{
passive:true
}
);


document.addEventListener(
"touchend",
stopMove
);







// ===============================
// 高清导出图片
// ===============================


document.getElementById("export")
.onclick=function(){


if(!img){


alert(
"请先上传图片"
);


return;


}



//重新绘制

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);



ctx.drawImage(
img,
0,
0
);



//计算真实比例

let scaleX=
canvas.width/
canvas.clientWidth;



let scaleY=
canvas.height/
canvas.clientHeight;



let x=
watermark.offsetLeft*
scaleX;



let y=
watermark.offsetTop*
scaleY;



ctx.save();



//字体

ctx.font=
"32px Microsoft YaHei";



ctx.fillStyle=
"rgba(255,255,255,0.95)";



ctx.shadowColor=
"rgba(0,0,0,.8)";


ctx.shadowBlur=6;



let lines=
watermark.innerText.split("\n");



lines.forEach(
(line,index)=>{


ctx.fillText(
line,
x,
y+index*42
);



}
);



ctx.restore();





let a=
document.createElement("a");



a.download=
"磐石水印_"
+
Date.now()
+
".png";



a.href=
canvas.toDataURL(
"image/png"
);



a.click();



};




// ===============================
// 初始化
// ===============================


updateWatermark();



</script>


</body>

</html>
