<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>磐石水印相机</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#1a1a2e;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei";margin:0;padding:16px}
.wrap{position:relative;background:#111;border-radius:8px;overflow:hidden}
canvas{display:block;max-width:100%}
.wm{position:absolute;color:rgba(255,255,255,.95);font-size:14px;line-height:1.6;text-shadow:0 1px 3px rgba(0,0,0,.8);cursor:move;white-space:pre;padding:4px;user-select:none}
input,select{background:#1f2937;border:1px solid #374151;color:#eee;border-radius:6px;padding:6px 8px;font-size:13px}
.btn{background:#2563eb;color:#fff;border:none;border-radius:6px;padding:8px 12px;cursor:pointer;font-size:13px}
.btn:hover{background:#1d4ed8}
.btn-green{background:#16a34a}.btn-green:hover{background:#15803d}
.btn-red{background:#dc2626}.btn-red:hover{background:#b91c1c}
.sug{background:#1f2937;border:1px solid #374151;border-radius:6px;max-height:160px;overflow-y:auto;position:absolute;z-index:10;width:calc(100% - 16px)}
.sug div{padding:8px;cursor:pointer;font-size:13px}.sug div:hover{background:#374151}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
</style>
</head>
<body>

<div class="flex gap-4 h-[95vh]">
<!-- 左侧面板 -->
<div class="w-[320px] bg-gray-800 p-4 rounded-lg overflow-auto">
<h2 class="text-lg font-bold mb-4">磐石水印相机</h2>

<div class="mb-3">
<label class="text-sm">1. 上传图片</label>
<input type="file" id="file" accept="image/*" class="w-full mt-1">
</div>

<div class="mb-3 relative">
<label class="text-sm">2. 地点（输入自动联想）</label>
<input id="loc" placeholder="如：大连 / 泰国达府" class="w-full mt-1">
<div id="sug" class="sug hidden"></div>
</div>

<div class="grid grid-cols-2 gap-2 mb-3">
<input id="lat" placeholder="纬度" class="mt-1">
<input id="lon" placeholder="经度" class="mt-1">
</div>

<div class="grid grid-cols-3 gap-2 mb-3">
<input id="wea" placeholder="天气" class="mt-1">
<input id="tmp" placeholder="温度" class="mt-1">
<input id="wind" placeholder="风力" class="mt-1">
</div>

<button onclick="getWeather()" class="btn btn-green w-full mb-3">🌐 自动获取天气</button>

<div class="mb-3">
<label class="text-sm">3. 快捷位置</label>
<div class="grid3">
<button onclick="setP('tl')" class="btn">左上</button>
<button onclick="setP('tm')" class="btn">中上</button>
<button onclick="setP('tr')" class="btn">右上</button>
<button onclick="setP('bl')" class="btn">左下</button>
<button onclick="setP('bm')" class="btn">中下</button>
<button onclick="setP('br')" class="btn">右下</button>
</div>
</div>

<div class="mb-3">
<label class="text-sm">4. 字号 / 透明度</label>
<input id="fs" type="range" min="12" max="28" value="14" class="w-full mt-1">
<input id="op" type="range" min="50" max="100" value="95" class="w-full mt-1">
</div>

<button onclick="exportImg()" class="btn btn-red w-full">📥 导出图片</button>
<p class="text-xs text-gray-500 mt-3">* 天气联网获取，断网自动估算<br>* 拖拽水印可微调位置</p>
</div>

<!-- 右侧画布 -->
<div class="flex-1 wrap" id="wrap">
<canvas id="cv"></canvas>
<div id="wm" class="wm"></div>
</div>
</div>

<script>
/* ========= 内置城市库 ========= */
const cities = [
  {n:"大连",lat:38.91,lon:121.61},
  {n:"北京",lat:39.90,lon:116.40},
  {n:"上海",lat:31.23,lon:121.47},
  {n:"广州",lat:23.12,lon:113.25},
  {n:"深圳",lat:22.54,lon:114.05},
  {n:"泰国达府",lat:16.88,lon:99.13},
  {n:"曼谷",lat:13.75,lon:100.50},
  {n:"东京",lat:35.68,lon:139.69},
  {n:"纽约",lat:40.71,lon:-74.00},
  {n:"伦敦",lat:51.50,lon:-0.12},
  {n:"新加坡",lat:1.35,lon:103.82}
];

/* ========= DOM ========= */
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
const wm=document.getElementById("wm"),wrap=document.getElementById("wrap");
const locI=document.getElementById("loc"),latI=document.getElementById("lat"),lonI=document.getElementById("lon");
const weaI=document.getElementById("wea"),tmpI=document.getElementById("tmp"),windI=document.getElementById("wind");
const sug=document.getElementById("sug");
let img=null,drag=false,dx=0,dy=0,ix=0,iy=0;

/* ========= 图片上传 ========= */
document.getElementById("file").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{img=new Image();img.onload=()=>{cv.width=img.width;cv.height=img.height;draw();setP("bl")};img.src=ev.target.result};
  r.readAsDataURL(f);
};
function draw(){if(img)ctx.drawImage(img,0,0);}

/* ========= 地点联想 ========= */
locI.oninput=()=>{
  const k=locI.value.trim();sug.innerHTML="";if(!k){sug.classList.add("hidden");return;}
  const rs=cities.filter(c=>c.n.includes(k)||c.n.toLowerCase().includes(k.toLowerCase()));
  if(rs.length){sug.classList.remove("hidden");rs.forEach(c=>{
    const d=document.createElement("div");d.textContent=c.n;d.onclick=()=>{locI.value=c.n;latI.value=c.lat;lonI.value=c.lon;sug.classList.add("hidden");update()};sug.appendChild(d);
  });}else sug.classList.add("hidden");
};

/* ========= 天气获取 ========= */
async function getWeather(){
  const lat=latI.value,lon=lonI.value;
  if(!lat||!lon){alert("请先选择或输入地点");return;}
  try{
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,wind_speed_10m`);
    const d=await r.json();
    tmpI.value=`${Math.round(d.current.temperature_2m)}℃`;
    windI.value=`风速${d.current.wind_speed_10m.toFixed(1)}m/s`;
    weaI.value="晴";
  }catch{
    const t=30-Math.abs(parseFloat(lat))*0.5+Math.random()*6-3;
    tmpI.value=`${Math.round(t)}℃`;
    weaI.value=["晴","多云","阴"][Math.floor(Math.random()*3)];
    windI.value="微风";
  }
  update();
}

/* ========= 水印文本 ========= */
function txt(){
  const d=new Date();
  const p=s=>String(s).padStart(2,"0");
  const tm=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  const lc=`${locI.value} ${latI.value}°N ${lonI.value}°E`;
  const wt=`${weaI.value} ${tmpI.value} ${windI.value}`;
  return [tm,lc,wt,"磐石水印相机 v4.3.4"].filter(Boolean).join("\n");
}

function update(){
  wm.innerText=txt();
  wm.style.fontSize=document.getElementById("fs").value+"px";
  wm.style.opacity=document.getElementById("op").value/100;
}
setInterval(update,1000);["fs","op"].forEach(id=>document.getElementById(id).oninput=update);

/* ========= 拖拽 ========= */
wm.onmousedown=e=>{drag=true;dx=e.clientX;dy=e.clientY;ix=wm.offsetLeft;iy=wm.offsetTop;};
window.onmousemove=e=>{if(!drag)return;let nx=ix+(e.clientX-dx),ny=iy+(e.clientY-dy);
  nx=Math.max(5,Math.min(nx,wrap.clientWidth-wm.offsetWidth-5));
  ny=Math.max(5,Math.min(ny,wrap.clientHeight-wm.offsetHeight-5));
  wm.style.left=nx+"px";wm.style.top=ny+"px";
};
window.onmouseup=()=>drag=false;

/* ========= 快捷位置 ========= */
function setP(p){
  const w=wrap.clientWidth, h=wrap.clientHeight, ow=wm.offsetWidth, oh=wm.offsetHeight;
  let l=10,t=10;
  if(p==="tm")l=(w-ow)/2;
  if(p==="tr"){l=w-ow-10;t=10;}
  if(p==="bl"){l=10;t=h-oh-10;}
  if(p==="bm"){l=(w-ow)/2;t=h-oh-10;}
  if(p==="br"){l=w-ow-10;t=h-oh-10;}
  wm.style.left=l+"px";wm.style.top=t+"px";
}

/* ========= 导出 ========= */
function exportImg(){
  if(!img){alert("请先上传图片");return;}
  draw();
  const rect=cv.getBoundingClientRect();
  const sx=cv.width/rect.width, sy=cv.height/rect.height;
  const x=parseFloat(wm.style.left||10)*sx;
  const y=parseFloat(wm.style.top||10)*sy;
  ctx.save();
  ctx.font=`${parseFloat(getComputedStyle(wm).fontSize)*sx}px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif`;
  ctx.fillStyle=`rgba(255,255,255,${wm.style.opacity||0.95})`;
  ctx.textBaseline="top";
  ctx.shadowColor="rgba(0,0,0,.8)";ctx.shadowBlur=4*sx;ctx.shadowOffsetX=sx;ctx.shadowOffsetY=sy;
  txt().split("\n").forEach((l,i)=>{ctx.fillText(l,x,y+i*parseFloat(getComputedStyle(wm).fontSize)*sy*1.6)});
  ctx.restore();
  const a=document.createElement("a");
  a.download=`磐石水印_${Date.now()}.png`;
  a.href=cv.toDataURL("image/png");
  a.click();
}
</script>
</body>
</html>
