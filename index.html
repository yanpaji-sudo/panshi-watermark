<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>磐石水印相机</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  body{background:#0b0b0b;font-family:"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;padding:12px;min-height:100vh;color:#e8d8a9}
  .wrap{max-width:420px;width:100%}
  .card{background:#121212;border:1.5px solid #c9a84c;border-radius:20px;padding:16px;box-shadow:0 0 40px rgba(201,168,76,.15)}
  .title{text-align:center;font-size:22px;font-weight:800;color:#f9e7a0;letter-spacing:2px;margin-bottom:6px}
  .sub{text-align:center;font-size:11px;color:#8a7a4a;margin-bottom:14px}
  .upload{display:flex;gap:10px;margin-bottom:14px}
  .upload button{flex:1;padding:12px;border-radius:12px;border:1.5px solid #c9a84c;background:transparent;color:#f9e7a0;font-size:14px;font-weight:700;cursor:pointer}
  .preview{width:100%;aspect-ratio:4/3;background:#0a0a0a;border:1px solid rgba(201,168,76,.25);border-radius:12px;overflow:hidden;margin-bottom:14px;display:flex;align-items:center;justify-content:center;color:#5a4a1a;font-size:14px}
  .preview img{width:100%;height:100%;object-fit:contain}
  .form{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
  .form input,.form select{padding:12px;border-radius:10px;border:1px solid rgba(201,168,76,.35);background:#0f0f0f;color:#f9e7a0;font-size:14px;outline:none}
  .actions{display:flex;gap:10px}
  .actions button{flex:1;padding:14px;border-radius:12px;border:none;font-size:15px;font-weight:800;cursor:pointer}
  .demo{background:rgba(201,168,76,.15);color:#c9a84c}
  .save{background:linear-gradient(135deg,#c9a84c,#f9e7a0);color:#1a1a1a}
  .hint{text-align:center;font-size:10px;color:#5a4a1a;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="title">磐石水印相机</div>
    <div class="sub">修复版 · 点击保存必响应</div>

    <div class="upload">
      <button onclick="document.getElementById('file').click()">📷 拍照/相册</button>
      <button class="demo" onclick="loadDemo()">🎯 演示照片</button>
    </div>
    <input type="file" id="file" accept="image/*" capture="environment" style="display:none">

    <div class="preview" id="preview">请选择照片或点演示</div>

    <div class="form">
      <input id="project" placeholder="项目名称（如：磐石流量·现场）">
      <input id="note" placeholder="备注信息（如：设备运行正常）">
    </div>

    <div class="actions">
      <button class="save" onclick="save()">⬇️ 保存水印照片</button>
    </div>

    <div class="hint">如 iOS 未自动保存，请长按打开的图片 → 存储到照片</div>
  </div>
</div>

<canvas id="cv" style="display:none"></canvas>

<script>
var currentImg = null;

// 加载演示照片（Canvas 生成，完全离线）
function loadDemo(){
  var cv = document.createElement('canvas');
  cv.width = 1200; cv.height = 900;
  var ctx = cv.getContext('2d');

  // 天空
  var grd = ctx.createLinearGradient(0,0,0,900);
  grd.addColorStop(0,'#87CEEB');grd.addColorStop(1,'#E0F6FF');
  ctx.fillStyle = grd; ctx.fillRect(0,0,1200,900);

  // 草地
  ctx.fillStyle = '#7CFC00'; ctx.fillRect(0,600,1200,300);

  // 树
  ctx.fillStyle = '#8B4513'; ctx.fillRect(300,500,40,100);
  ctx.fillStyle = '#228B22'; ctx.beginPath(); ctx.arc(320,480,60,0,Math.PI*2); ctx.fill();

  // 太阳
  ctx.fillStyle = '#FFD700'; ctx.beginPath(); ctx.arc(1000,120,50,0,Math.PI*2); ctx.fill();

  // 建筑
  ctx.fillStyle = '#888'; ctx.fillRect(800,400,200,200);

  currentImg = new Image();
  currentImg.onload = function(){
    document.getElementById('preview').innerHTML = '<img src="'+cv.toDataURL()+'">';
    alert('✅ 演示照片加载成功');
  };
  currentImg.src = cv.toDataURL();
}

// 选择照片
document.getElementById('file').onchange = function(e){
  var f = e.target.files[0];
  if(!f) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    currentImg = new Image();
    currentImg.onload = function(){
      document.getElementById('preview').innerHTML = '<img src="'+ev.target.result+'">';
      alert('✅ 照片加载成功');
    };
    currentImg.src = ev.target.result;
  };
  reader.readAsDataURL(f);
};

// 保存（唯一出口，每一步都有反馈）
function save(){
  alert('🟢 已进入保存函数');

  if(!currentImg){
    alert('❌ 请先选择照片或点「演示照片」');
    return;
  }

  var cv = document.getElementById('cv');
  var MAX = 2000;
  var scale = Math.min(1, MAX / Math.max(currentImg.width, currentImg.height));
  cv.width = currentImg.width * scale;
  cv.height = currentImg.height * scale;

  var ctx = cv.getContext('2d');
  ctx.drawImage(currentImg, 0, 0, cv.width, cv.height);

  // 水印
  var project = document.getElementById('project').value || '磐石流量';
  var note = document.getElementById('note').value || '现场记录';
  var now = new Date();
  var time = now.toLocaleString('zh-CN');

  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(20,20,340,140);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 28px sans-serif';
  ctx.fillText('磐石水印', 40, 55);
  ctx.font = '20px sans-serif';
  ctx.fillText(project, 40, 85);
  ctx.fillText(time, 40, 110);
  ctx.fillText(note, 40, 135);

  alert('🟢 水印绘制完成，准备导出');

  // 导出（双兜底）
  cv.toBlob(function(blob){
    if(!blob){
      alert('❌ toBlob 失败，尝试备用方案');
      fallback();
      return;
    }
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '磐石水印_' + Date.now() + '.jpg';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    alert('✅ 下载已触发（如未自动保存，请长按图片存储）');
  }, 'image/jpeg', 0.9);

  function fallback(){
    var dataURL = cv.toDataURL('image/jpeg', 0.9);
    var a = document.createElement('a');
    a.href = dataURL;
    a.download = '磐石水印_' + Date.now() + '.jpg';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    alert('✅ 备用方案已执行');
  }
}
</script>
</body>
</html>
