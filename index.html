<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>水印相机 - 自动联想版</title>
<script src="https://webapi.amap.com/maps?v=2.0&key=YOUR_AMAP_KEY"></script>
<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial;
    background: #111;
    color: #fff;
    margin: 0;
}
#container {
    position: relative;
    width: 900px;
    margin: 20px auto;
}
canvas {
    width: 100%;
    border-radius: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
}
.controls {
    padding: 12px;
    background: #1e1e1e;
}
input, button {
    padding: 8px 12px;
    font-size: 14px;
    margin-right: 8px;
}
#suggestions {
    background: #222;
    max-height: 160px;
    overflow-y: auto;
    display: none;
}
#suggestions div {
    padding: 6px 10px;
    cursor: pointer;
}
#suggestions div:hover {
    background: #333;
}
/* 水印样式 */
.watermark {
    position: absolute;
    left: 16px;
    bottom: 60px;
    color: rgba(255,255,255,0.9);
    font-size: 14px;
    line-height: 1.6;
    text-shadow: 0 1px 2px rgba(0,0,0,.8);
    pointer-events: auto;
    cursor: move;
    white-space: pre-line;
}
</style>
</head>
<body>

<div id="container">
    <canvas id="canvas" width="900" height="600"></canvas>
    <div class="watermark" id="watermark">2026-08-05 13:28:40
泰国·达府 Tak 16.2°N 99.1°E
晴 31℃ 东南风2级
水印相机 v4.3.4</div>

    <div class="controls">
        <input id="locationInput" placeholder="输入地点，如：泰国达府" style="width:200px;" />
        <button onclick="searchLocation()">搜索</button>
        <button onclick="exportImage()">导出图片</button>
        <div id="suggestions"></div>
    </div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const watermark = document.getElementById("watermark");

// ===== 1. 加载你的磐石图 =====
const img = new Image();
img.crossOrigin = "anonymous";
img.src = "https://one-agent-prod-1343551737.cos.ap-guangzhou.myqcloud.com/outputs/0104/74599e22dc9e4a94bf48c9ecd924b9d9/0PHC5amPWZE/sandstone_strategy.png?q-sign-algorithm=sha1&q-ak=AKIDDMTk0KZdUSL21fBYigcl3C8rMeiT5TdZ&q-sign-time=1785745285%3B1785752485&q-key-time=1785745285%3B1785752485&q-header-list=host&q-url-param-list=&q-signature=b0e5c256735bccd443adf75b6faa26bf39c5469b";
img.onload = draw;

function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0,canvas.width,canvas.height);
}

// ===== 2. 自动联想 =====
let placeSearch;
AMap.plugin("AMap.PlaceSearch", () => {
    placeSearch = new AMap.PlaceSearch({ pageSize: 5 });
});

document.getElementById("locationInput").addEventListener("input", searchLocation);

function searchLocation() {
    const kw = document.getElementById("locationInput").value.trim();
    if (!kw || !placeSearch) return;
    placeSearch.search(kw, (status, res) => {
        const box = document.getElementById("suggestions");
        box.innerHTML = "";
        if (status === "complete") {
            box.style.display = "block";
            res.poiList.pois.forEach(p => {
                const d = document.createElement("div");
                d.textContent = p.name + " · " + p.cityname;
                d.onclick = () => selectPlace(p);
                box.appendChild(d);
            });
        }
    });
}

// ===== 3. 选中后生成水印 =====
function selectPlace(p) {
    document.getElementById("suggestions").style.display = "none";
    const now = new Date();
    const t = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")} ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}:${String(now.getSeconds()).padStart(2,"0")}`;
    const loc = `${p.name} ${p.location.lat.toFixed(1)}°N ${p.location.lng.toFixed(1)}°E`;
    watermark.innerText = `${t}\n${loc}\n晴 31℃ 东南风2级\n水印相机 v4.3.4`;
}

// ===== 4. 拖拽水印 =====
let dragging = false, offX=0, offY=0;
watermark.onmousedown = e => {
    dragging=true;
    offX=e.offsetX; offY=e.offsetY;
};
window.onmousemove = e => {
    if(!dragging) return;
    watermark.style.left = (e.clientX - offX) + "px";
    watermark.style.top = (e.clientY - offY) + "px";
};
window.onmouseup = () => dragging=false;

// ===== 5. 导出 =====
function exportImage() {
    draw();
    ctx.font = "14px -apple-system, PingFang SC";
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.shadowColor = "rgba(0,0,0,0.8)";
    ctx.shadowBlur = 4;
    const lines = watermark.innerText.split("\n");
    const x = parseInt(watermark.style.left) || 16;
    const y = parseInt(watermark.style.top) || canvas.height - 60;
    lines.forEach((l,i)=>ctx.fillText(l, x, y + i*22));
    const a = document.createElement("a");
    a.download = "磐石战略_水印图.png";
    a.href = canvas.toDataURL("image/png");
    a.click();
}
</script>
</body>
</html>
