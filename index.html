<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>磐石水印相机 v5.0</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
padding:15px;
background:#111827;
color:#fff;
font-family:
-apple-system,
BlinkMacSystemFont,
"Microsoft YaHei",
Arial;
}


.app{
display:flex;
gap:15px;
height:95vh;
}


.panel{
width:330px;
background:#1f2937;
border-radius:12px;
padding:15px;
overflow:auto;
}


.preview{
flex:1;
background:#000;
border-radius:12px;
position:relative;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
}


canvas{
max-width:100%;
max-height:100%;
}


input,button{
width:100%;
margin-top:8px;
padding:10px;
border-radius:8px;
border:1px solid #374151;
background:#111827;
color:white;
}


button{
background:#2563eb;
cursor:pointer;
}


button:hover{
background:#1d4ed8;
}


.green{
background:#16a34a;
}


.red{
background:#dc2626;
}


.title{
font-size:20px;
font-weight:bold;
margin-bottom:15px;
}


.watermark{
position:absolute;
left:20px;
bottom:20px;
color:white;
font-size:16px;
line-height:1.6;
text-shadow:
0 2px 4px #000;
white-space:pre-line;
cursor:move;
}


.search-box{
position:relative;
}


.result{
position:absolute;
top:100%;
left:0;
right:0;
background:#111827;
z-index:99;
border-radius:8px;
overflow:hidden;
}


.result div{
padding:10px;
border-bottom:1px solid #374151;
cursor:pointer;
}


.result div:hover{
background:#374151;
}


.row{
display:flex;
gap:8px;
}


.row input{
width:50%;
}


</style>

</head>


<body>


<div class="app">


<div class="panel">


<div class="title">
磐石水印相机 v5.0
</div>



<input 
type="file"
id="file"
accept="image/*"
capture="environment">



<div class="search-box">


<input
id="address"
placeholder="输入地点，例如：北京、曼谷、巴黎">


<div id="result"
class="result">
</div>


</div>



<button id="gps" class="green">
📍 获取当前位置
</button>



<div class="row">

<input id="lat"
placeholder="纬度">


<input id="lon"
placeholder="经度">

</div>




<input id="weather"
placeholder="天气">


<input id="temp"
placeholder="温度">



<button id="getWeather">
🌤 获取天气
</button>



<button id="export"
class="red">
📥 导出图片
</button>


</div>





<div class="preview"
id="preview">


<canvas id="canvas"></canvas>


<div
id="watermark"
class="watermark">
</div>


</div>


</div>



<script>


const file =
document.getElementById("file");


const canvas =
document.getElementById("canvas");


const ctx =
canvas.getContext("2d");


const watermark =
document.getElementById("watermark");


const address =
document.getElementById("address");


const lat =
document.getElementById("lat");


const lon =
document.getElementById("lon");


const result =
document.getElementById("result");



let img=null;



// 图片上传

file.onchange=function(e){

let f=e.target.files[0];

if(!f)return;


let reader=new FileReader();


reader.onload=function(ev){


img=new Image();


img.onload=function(){


canvas.width=img.width;

canvas.height=img.height;


draw();


};


img.src=ev.target.result;


};


reader.readAsDataURL(f);


};




function draw(){


if(!img)return;


ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);


ctx.drawImage(
img,
0,
0
);


}
// ===============================
// 地址自动联想
// ===============================

let searchTimer=null;


address.oninput=function(){


clearTimeout(searchTimer);


let keyword=this.value.trim();


if(!keyword){

result.innerHTML="";

return;

}



searchTimer=setTimeout(async()=>{


try{


let url=
"https://photon.komoot.io/api/?limit=8&q="
+
encodeURIComponent(keyword);



let res=
await fetch(url);



let data=
await res.json();



result.innerHTML="";



data.features.forEach(item=>{


let p=item.properties;


let name=
[
p.name,
p.city,
p.state,
p.country
]
.filter(Boolean)
.join(" ");



let div=
document.createElement("div");


div.innerText=name;



div.onclick=function(){


address.value=name;



lat.value=
item.geometry.coordinates[1].toFixed(6);



lon.value=
item.geometry.coordinates[0].toFixed(6);



result.innerHTML="";



updateWatermark();


};



result.appendChild(div);



});



}catch(e){


console.log("地址搜索失败",e);


}



},500);


};




// ===============================
// GPS定位
// ===============================


document.getElementById("gps")
.onclick=function(){


if(!navigator.geolocation){


alert("当前浏览器不支持定位");


return;

}



navigator.geolocation.getCurrentPosition(

function(pos){


lat.value=
pos.coords.latitude.toFixed(6);



lon.value=
pos.coords.longitude.toFixed(6);



updateWatermark();


},


function(){


alert("定位失败，请允许浏览器定位权限");


}


);


};





// ===============================
// 天气获取
// ===============================


document.getElementById("getWeather")
.onclick=
async function(){



if(!lat.value || !lon.value){


alert("请先选择地址或定位");


return;


}



try{


let url=

`https://api.open-meteo.com/v1/forecast?latitude=${lat.value}&longitude=${lon.value}&current=temperature_2m,wind_speed_10m`;



let res=
await fetch(url);



let data=
await res.json();



document.getElementById("temp").value=

Math.round(
data.current.temperature_2m
)
+"℃";



document.getElementById("weather").value=

"晴";


updateWatermark();



}catch(e){


document.getElementById("weather").value="未知";


}



};





// ===============================
// 水印内容更新
// ===============================


function updateWatermark(){



let now=
new Date();



let time=

now.getFullYear()
+"-"
+
String(now.getMonth()+1).padStart(2,"0")
+
"-"
+
String(now.getDate()).padStart(2,"0")
+
" "
+
String(now.getHours()).padStart(2,"0")
+
":"
+
String(now.getMinutes()).padStart(2,"0");



watermark.innerText=

time

+"\n\n📍 "

+
address.value

+"\n"

+
lat.value
+
"°N "
+
lon.value
+
"°E"

+"\n\n"

+
document.getElementById("weather").value
+
" "
+
document.getElementById("temp").value

+"\n\n磐石水印相机 v5.0";



}


// 定时刷新时间

setInterval(
updateWatermark,
1000
);
// ===============================
// 水印拖动
// ===============================

let dragging=false;

let startX=0;
let startY=0;

let wmX=20;
let wmY=20;


watermark.onmousedown=function(e){


dragging=true;


startX=e.clientX-wmX;

startY=e.clientY-wmY;


};



document.onmousemove=function(e){


if(!dragging)return;


wmX=e.clientX-startX;

wmY=e.clientY-startY;



// 限制范围

wmX=Math.max(0,wmX);

wmY=Math.max(0,wmY);



watermark.style.left=
wmX+"px";


watermark.style.top=
wmY+"px";


watermark.style.bottom="auto";



};



document.onmouseup=function(){

dragging=false;

};





// ===============================
// 导出图片
// ===============================


document.getElementById("export")
.onclick=function(){


if(!img){


alert("请先上传图片");


return;


}



// 重新绘制原图

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);


ctx.drawImage(
img,
0,
0
);



// 比例计算

let scaleX=
canvas.width /
canvas.clientWidth;


let scaleY=
canvas.height /
canvas.clientHeight;



let x=
wmX*scaleX;


let y=
wmY*scaleY;



ctx.save();



ctx.font=
"32px Microsoft YaHei";



ctx.fillStyle=
"rgba(255,255,255,0.95)";



ctx.shadowColor=
"black";


ctx.shadowBlur=
5;



let lines=
watermark.innerText.split("\n");



lines.forEach((line,i)=>{


ctx.fillText(
line,
x,
y+i*45
);


});



ctx.restore();



// 下载

let a=
document.createElement("a");


a.download=
"磐石水印_"+Date.now()+".png";


a.href=
canvas.toDataURL(
"image/png"
);


a.click();



};




// 初始化

updateWatermark();



</script>


</body>

</html>
