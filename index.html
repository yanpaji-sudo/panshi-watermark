<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>磐石水印相机 v7.0</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
padding:12px;
background:#111827;
color:#fff;
font-family:
-apple-system,
BlinkMacSystemFont,
"Microsoft YaHei",
Arial;
}


.app{

display:flex;
gap:12px;
height:96vh;

}


.panel{

width:330px;
background:#1f2937;
border-radius:12px;
padding:15px;
overflow:auto;

}



.preview{

flex:1;
background:#000;
border-radius:12px;
position:relative;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;

}



canvas{

max-width:100%;
max-height:100%;

}



.title{

font-size:20px;
font-weight:bold;
margin-bottom:15px;

}



input,
button{

width:100%;
margin-top:8px;
padding:10px;

border-radius:8px;
border:1px solid #374151;

background:#111827;
color:white;

font-size:14px;

}



button{

background:#2563eb;
cursor:pointer;

}


button:hover{

background:#1d4ed8;

}



.green{

background:#16a34a;

}



.red{

background:#dc2626;

}



.row{

display:flex;
gap:8px;

}



.row input{

width:50%;

}



.search{

position:relative;

}



.list{

position:absolute;
top:100%;
left:0;
right:0;

background:#111827;

border-radius:8px;

overflow:hidden;

z-index:99;

}



.list div{

padding:10px;

border-bottom:1px solid #374151;

cursor:pointer;

font-size:14px;

}



.list div:hover{

background:#374151;

}



/* 水印 */

.watermark{

position:absolute;

left:25px;

bottom:25px;

color:rgba(255,255,255,.9);

font-family:
"Microsoft YaHei",
Arial;

font-weight:500;

line-height:1.2;

letter-spacing:.3px;

white-space:pre-line;

text-shadow:

0 2px 5px rgba(0,0,0,.9);

cursor:move;

max-width:90%;

}



</style>

</head>


<body>


<div class="app">


<div class="panel">


<div class="title">
磐石水印相机 v7.0
</div>



<input
id="file"
type="file"
accept="image/*"
capture="environment">



<div class="search">

<input
id="address"
placeholder="输入中国地点">

<div
id="list"
class="list">
</div>

</div>



<div class="row">

<input
id="lat"
placeholder="纬度">

<input
id="lon"
placeholder="经度">

</div>



<button
id="gps"
class="green">

📍 获取当前位置

</button>



<input
id="weather"
placeholder="天气">


<input
id="temp"
placeholder="温度">


<button
id="getWeather">

☀ 自动获取天气

</button>




<button
id="export"
class="red">

📥 导出高清图片

</button>



</div>





<div class="preview">


<canvas id="canvas"></canvas>



<div
id="watermark"
class="watermark">

</div>



</div>


</div>


<script>


const file=
document.getElementById("file");


const canvas=
document.getElementById("canvas");


const ctx=
canvas.getContext("2d");



const address=
document.getElementById("address");


const lat=
document.getElementById("lat");


const lon=
document.getElementById("lon");


const list=
document.getElementById("list");


const watermark=
document.getElementById("watermark");



let img=null;



// 上传图片

file.onchange=function(e){


let f=e.target.files[0];


if(!f)return;



let reader=
new FileReader();



reader.onload=function(ev){


img=new Image();



img.onload=function(){


canvas.width=
img.width;


canvas.height=
img.height;


draw();


updateWatermark();


};



img.src=
ev.target.result;


};



reader.readAsDataURL(f);


};




function draw(){


if(!img)return;


ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);


ctx.drawImage(
img,
0,
0
);


}
// ===============================
// 中国地址自动联想
// ===============================


let timer=null;



address.oninput=function(){


clearTimeout(timer);



let key=this.value.trim();



if(!key){

list.innerHTML="";

return;

}



timer=setTimeout(async()=>{


try{


let url=

"https://nominatim.openstreetmap.org/search?format=json&accept-language=zh-CN&countrycodes=cn&limit=10&q="
+
encodeURIComponent(key);



let res=
await fetch(url);



let data=
await res.json();



list.innerHTML="";



data.forEach(item=>{



let div=
document.createElement("div");



let name=
item.display_name
.replace(/, China/g,"")
.replace(/, 中国/g,"");



div.innerText=name;



div.onclick=function(){



address.value=
formatAddress(name);



lat.value=
Number(item.lat).toFixed(6);



lon.value=
Number(item.lon).toFixed(6);



list.innerHTML="";



updateWatermark();



};



list.appendChild(div);



});



}catch(e){


console.log(e);


}



},500);



};






// 地址格式优化

function formatAddress(str){



let arr=
str.split(",");



let result=[];



arr.forEach(x=>{


x=x.trim();



if(
x &&
!result.includes(x)
){


result.push(x);


}



});



return result
.slice(0,4)
.join("");



}







// ===============================
// GPS定位
// ===============================


document.getElementById("gps")
.onclick=function(){



navigator.geolocation.getCurrentPosition(

async function(pos){


lat.value=
pos.coords.latitude.toFixed(6);


lon.value=
pos.coords.longitude.toFixed(6);



try{


let url=

"https://nominatim.openstreetmap.org/reverse?format=json&accept-language=zh-CN&lat="
+
lat.value
+
"&lon="
+
lon.value;



let res=
await fetch(url);



let data=
await res.json();



if(data.display_name){


address.value=
formatAddress(
data.display_name
);


}



}catch(e){}



updateWatermark();



},


function(){


alert(
"定位失败"
);


}


);



};






// ===============================
// 天气
// ===============================


document.getElementById("getWeather")
.onclick=
async function(){



if(!lat.value||!lon.value){


alert(
"请先选择地点"
);


return;

}



try{


let url=

`https://api.open-meteo.com/v1/forecast?latitude=${lat.value}&longitude=${lon.value}&current=temperature_2m,wind_speed_10m`;



let res=
await fetch(url);



let data=
await res.json();



let temp=
Math.round(
data.current.temperature_2m
);



let wind=
data.current.wind_speed_10m;



document.getElementById("weather")
.value=
"☀ 晴 风速"+wind+"m/s";



document.getElementById("temp")
.value=
temp+"℃";



updateWatermark();



}catch(e){


document.getElementById("weather")
.value=
"天气未知";


}



};







// ===============================
// 真实水印排版
// ===============================


function updateWatermark(){



let d=
new Date();



let time=

d.getFullYear()
+
"-"
+
String(d.getMonth()+1).padStart(2,"0")
+
"-"
+
String(d.getDate()).padStart(2,"0")
+
" "
+
String(d.getHours()).padStart(2,"0")
+
":"
+
String(d.getMinutes()).padStart(2,"0");



let size=18;



if(canvas.width){


size=
canvas.width/65;



size=
Math.max(
16,
Math.min(
42,
size
)
);


}



watermark.style.fontSize=
size+"px";



let locationText=
address.value||
"";


let weather=
document.getElementById("weather").value
||"☀ 晴";



let temperature=
document.getElementById("temp").value
||"";




watermark.innerText=

time

+
"\n"

+
"📍 "
+
locationText

+
"\n"

+
lat.value
+
"°N "
+
lon.value
+
"°E"

+
"\n"

+
weather
+
" "
+
temperature

+
"\n"

+
"磐石水印相机";



}




setInterval(
updateWatermark,
1000
);// ===============================
// 水印拖动（电脑+手机）
// ===============================


let dragging=false;

let startX=0;
let startY=0;

let wmX=25;
let wmY=25;



function getPoint(e){

return e.touches?
e.touches[0]:
e;

}



watermark.addEventListener(
"mousedown",
function(e){


let p=getPoint(e);


dragging=true;


startX=
p.clientX-wmX;


startY=
p.clientY-wmY;


watermark.style.bottom="auto";


}

);



watermark.addEventListener(
"touchstart",
function(e){


let p=getPoint(e);


dragging=true;


startX=
p.clientX-wmX;


startY=
p.clientY-wmY;


watermark.style.bottom="auto";


},
{
passive:true
}

);





document.addEventListener(
"mousemove",
function(e){


if(!dragging)return;



wmX=
e.clientX-startX;


wmY=
e.clientY-startY;



wmX=Math.max(
0,
wmX
);


wmY=Math.max(
0,
wmY
);



watermark.style.left=
wmX+"px";


watermark.style.top=
wmY+"px";



}

);





document.addEventListener(
"touchmove",
function(e){


if(!dragging)return;



let p=
getPoint(e);



wmX=
p.clientX-startX;


wmY=
p.clientY-startY;



wmX=Math.max(
0,
wmX
);


wmY=Math.max(
0,
wmY
);



watermark.style.left=
wmX+"px";


watermark.style.top=
wmY+"px";



},
{
passive:true
}

);





document.addEventListener(
"mouseup",
function(){

dragging=false;

}
);



document.addEventListener(
"touchend",
function(){

dragging=false;

}
);







// ===============================
// 高清导出
// ===============================


document.getElementById("export")
.onclick=function(){



if(!img){


alert(
"请先上传图片"
);


return;

}



//重新绘制图片


ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);



ctx.drawImage(
img,
0,
0
);



//真实比例


let scaleX=
canvas.width/
canvas.clientWidth;


let scaleY=
canvas.height/
canvas.clientHeight;



let x=
watermark.offsetLeft*
scaleX;


let y=
watermark.offsetTop*
scaleY;



//根据原图自动字体


let fontSize=
canvas.width/65;



fontSize=Math.max(
24,
Math.min(
70,
fontSize
)
);




ctx.save();



ctx.font=
`500 ${fontSize}px Microsoft YaHei`;



ctx.fillStyle=
"rgba(255,255,255,0.90)";



ctx.shadowColor=
"rgba(0,0,0,0.85)";



ctx.shadowBlur=
fontSize/5;



ctx.textBaseline=
"top";



let lines=
watermark.innerText.split("\n");



let lineHeight=
fontSize*1.25;



lines.forEach(
(line,index)=>{


ctx.fillText(
line,
x,
y+index*lineHeight
);



}

);



ctx.restore();






//下载


let link=
document.createElement("a");



link.download=
"磐石水印_"
+
Date.now()
+
".png";



link.href=
canvas.toDataURL(
"image/png",
1
);



link.click();



};





// 初始化

updateWatermark();


</script>


</body>

</html>
