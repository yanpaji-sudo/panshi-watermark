<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>磐石水印相机</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(circle at top, #1a1208, #050505 70%);
    color: #f5e6b0;
    min-height: 100vh;
    padding: 12px;
    user-select: none;
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    border: 1px solid rgba(245, 210, 120, 0.45);
    border-radius: 18px;
    padding: 14px;
    background: rgba(8, 8, 8, 0.78);
    box-shadow: 0 0 18px rgba(255, 190, 80, 0.15);
  }

  .header {
    text-align: center;
    margin-bottom: 12px;
  }

  .header h1 {
    font-size: 22px;
    color: #ffe28a;
    letter-spacing: 2px;
  }

  .header p {
    font-size: 12px;
    color: #b9a26a;
    margin-top: 4px;
  }

  .success-banner {
    display: none;
    background: rgba(40, 180, 90, 0.18);
    border: 1px solid rgba(80, 230, 130, 0.55);
    color: #9bf2b5;
    text-align: center;
    padding: 8px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 10px;
  }

  .btn-row {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
  }

  .btn {
    flex: 1;
    border: 1px solid #d4af50;
    background: linear-gradient(180deg, rgba(60,40,15,0.9), rgba(20,15,5,0.95));
    color: #ffe9a8;
    padding: 11px 0;
    border-radius: 12px;
    font-size: 15px;
    cursor: pointer;
    text-align: center;
  }

  .btn:active {
    filter: brightness(1.2);
  }

  .preview-box {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    border: 1px solid rgba(212,175,80,0.55);
    border-radius: 14px;
    overflow: hidden;
    background: #000;
    margin-bottom: 10px;
  }

  .preview-box img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  .badge {
    position: absolute;
    right: 10px;
    top: 10px;
    background: rgba(255, 200, 80, 0.9);
    color: #1a1208;
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 8px;
    font-weight: bold;
    display: none;
  }

  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
    border-bottom: 1px solid rgba(212,175,80,0.25);
    padding-bottom: 8px;
    overflow-x: auto;
  }

  .tab {
    flex: 1;
    min-width: 70px;
    text-align: center;
    padding: 8px 4px;
    font-size: 13px;
    border-radius: 8px;
    border: 1px solid transparent;
    color: #c9b57a;
    cursor: pointer;
    white-space: nowrap;
  }

  .tab.active {
    border-color: #d4af50;
    color: #ffe28a;
    background: rgba(40,28,10,0.75);
  }

  .panel { display: none; }
  .panel.active { display: block; }

  .field {
    margin-bottom: 10px;
  }

  .field label {
    display: block;
    font-size: 13px;
    color: #d8c98a;
    margin-bottom: 5px;
  }

  input[type="text"], input[type="datetime-local"], textarea {
    width: 100%;
    padding: 11px;
    border-radius: 10px;
    border: 1px solid rgba(212,175,80,0.55);
    background: rgba(15,12,6,0.9);
    color: #ffeec0;
    font-size: 14px;
    outline: none;
  }

  textarea { min-height: 64px; resize: none; }

  .check-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 8px;
  }

  .check-item {
    border: 1px solid rgba(212,175,80,0.4);
    border-radius: 10px;
    padding: 9px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 7px;
    background: rgba(15,12,6,0.7);
  }

  .pos-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .pos-item {
    border: 1px solid rgba(212,175,80,0.35);
    border-radius: 10px;
    padding: 10px;
    text-align: center;
    font-size: 13px;
    cursor: pointer;
    background: rgba(15,12,6,0.7);
  }

  .pos-item.active {
    border-color: #ffd66b;
    color: #fff3b8;
    box-shadow: 0 0 8px rgba(255,200,90,0.35);
  }

  .preset-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 7px;
    margin-top: 6px;
  }

  .preset-item {
    border: 1px solid rgba(212,175,80,0.35);
    border-radius: 9px;
    padding: 8px 0;
    text-align: center;
    font-size: 12px;
    cursor: pointer;
    background: rgba(15,12,6,0.7);
  }

  .preset-item.active {
    border-color: #ffd66b;
    color: #fff3b8;
  }

  .slider-row {
    margin-top: 10px;
  }

  .slider-row label {
    font-size: 13px;
    color: #d8c98a;
    display: flex;
    justify-content: space-between;
  }

  input[type="range"] {
    width: 100%;
  }

  .person-list {
    margin-top: 8px;
  }

  .person-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid rgba(212,175,80,0.3);
    border-radius: 10px;
    padding: 9px 11px;
    margin-bottom: 7px;
    font-size: 14px;
    background: rgba(15,12,6,0.7);
  }

  .small-btn {
    border: 1px solid #d4af50;
    background: transparent;
    color: #ffe9a8;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
  }

  .bottom-row {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }

  .reset-btn {
    flex: 1;
    border: 1px solid #ff6b6b;
    color: #ffb1b1;
    background: rgba(40,10,10,0.8);
    padding: 13px;
    border-radius: 12px;
    font-size: 15px;
    cursor: pointer;
  }

  .save-btn {
    flex: 1.6;
    border: 1px solid #ffd66b;
    color: #1a1208;
    background: linear-gradient(180deg, #ffe28a, #d4af50);
    padding: 13px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
  }

  .progress {
    height: 6px;
    border-radius: 6px;
    background: rgba(255,255,255,0.08);
    overflow: hidden;
    margin-top: 10px;
    display: none;
  }

  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ffd66b, #9bf2b5);
    transition: width 0.2s;
  }

  .toast {
    position: fixed;
    left: 50%;
    top: 24px;
    transform: translateX(-50%);
    background: rgba(20,15,5,0.95);
    border: 1px solid #d4af50;
    color: #ffe9a8;
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 13px;
    z-index: 9999;
    display: none;
    max-width: 88%;
    text-align: center;
  }

  .hint {
    font-size: 11px;
    color: #8e7d4d;
    text-align: center;
    margin-top: 8px;
    line-height: 1.5;
  }

  canvas { display: none; }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1>磐石水印相机</h1>
    <p>本地处理 · 不上传服务器 · 工程级水印</p>
  </div>

  <div class="success-banner" id="successBanner">保存成功提示将在此处/Toast 显示</div>

  <div class="btn-row">
    <label class="btn" for="cameraInput">📷 拍照</label>
    <label class="btn" for="albumInput">🖼️ 相册</label>
    <input type="file" id="cameraInput" accept="image/*" capture="camera" style="display:none" />
    <input type="file" id="albumInput" accept="image/*" style="display:none" />
  </div>

  <div class="preview-box">
    <img id="previewImg" alt="预览" />
    <div class="badge" id="addedBadge">已添加</div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="basic">基本信息</div>
    <div class="tab" data-tab="style">水印样式</div>
    <div class="tab" data-tab="person">人员</div>
    <div class="tab" data-tab="advanced">高级</div>
  </div>

  <div class="panel active" id="panel-basic">
    <div class="field">
      <label>项目名称</label>
      <input type="text" id="project" value="磐石流量-现场" />
    </div>

    <div class="field">
      <label>备注信息</label>
      <textarea id="note" placeholder="例如：设备运行正常，流量稳定达标"></textarea>
    </div>

    <div class="field">
      <label>地点（输入自动联想/可手动填）</label>
      <input type="text" id="placeInput" placeholder="北京市, 中国" />
    </div>

    <div class="field">
      <label>
        <input type="checkbox" id="autoWeather" checked />
        自动获取天气
      </label>
      <div id="weatherText" style="font-size:12px;color:#9bd8a8;margin-top:4px;">未获取</div>
    </div>

    <div class="field">
      <label>
        <input type="checkbox" id="customTimeChk" />
        自定义时间（不勾则当前时间）
      </label>
      <input type="datetime-local" id="timeInput" style="margin-top:6px;display:none;" />
    </div>
  </div>

  <div class="panel" id="panel-style">
    <div class="field">
      <label>水印位置</label>
      <div class="pos-grid">
        <div class="pos-item" data-pos="tl">↖ 左上角</div>
        <div class="pos-item" data-pos="tr">↗ 右上角</div>
        <div class="pos-item active" data-pos="bl">↙ 左下角</div>
        <div class="pos-item" data-pos="br">↘ 右下角</div>
      </div>
    </div>

    <div class="field">
      <label>预设风格</label>
      <div class="preset-grid">
        <div class="preset-item active" data-preset="red">经典红条</div>
        <div class="preset-item" data-preset="black">半透黑底</div>
        <div class="preset-item" data-preset="gold">黑金尊享</div>
        <div class="preset-item" data-preset="white">白底黑字</div>
      </div>
    </div>

    <div class="field">
      <label>显示字段（勾选即显示）</label>
      <div class="check-grid">
        <div class="check-item"><input type="checkbox" id="f-project" checked> 项目名称</div>
        <div class="check-item"><input type="checkbox" id="f-time" checked> 时间</div>
        <div class="check-item"><input type="checkbox" id="f-date" checked> 日期</div>
        <div class="check-item"><input type="checkbox" id="f-week" checked> 星期</div>
        <div class="check-item"><input type="checkbox" id="f-place" checked> 地点</div>
        <div class="check-item"><input type="checkbox" id="f-weather" checked> 天气气温</div>
        <div class="check-item"><input type="checkbox" id="f-note" checked> 备注</div>
        <div class="check-item"><input type="checkbox" id="f-redbar" checked> 红色竖条</div>
        <div class="check-item"><input type="checkbox" id="f-cert" checked> 官方认证标</div>
        <div class="check-item"><input type="checkbox" id="f-loc"> 经纬度</div>
        <div class="check-item"><input type="checkbox" id="f-addr"> 详细地址</div>
        <div class="check-item"><input type="checkbox" id="f-compass"> 指南针</div>
      </div>
    </div>

    <div class="slider-row">
      <label>字号 <span id="fontSizeVal">22px</span></label>
      <input type="range" id="fontSizeRange" min="12" max="42" value="22" />
    </div>

    <div class="slider-row">
      <label>不透明度 <span id="opacityVal">72%</span></label>
      <input type="range" id="opacityRange" min="20" max="100" value="72" />
    </div>

    <div class="slider-row">
      <label>圆角 <span id="radiusVal">10px</span></label>
      <input type="range" id="radiusRange" min="0" max="24" value="10" />
    </div>
  </div>

  <div class="panel" id="panel-person">
    <div class="field">
      <label>人员列表</label>
      <div class="person-list" id="personList"></div>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <input type="text" id="personName" placeholder="输入姓名" />
        <button class="small-btn" id="addPersonBtn">添加</button>
      </div>
    </div>
  </div>

  <div class="panel" id="panel-advanced">
    <div class="field">
      <label><input type="checkbox" id="advLocation" checked> 启用定位</label>
    </div>
    <div class="field">
      <label><input type="checkbox" id="advWeather" checked> 自动天气</label>
    </div>
    <div class="field">
      <label><input type="checkbox" id="advSeconds"> 时间显示秒数</label>
    </div>
    <div class="field">
      <label><input type="checkbox" id="advCert" checked> 显示官方认证标</label>
    </div>
  </div>

  <div class="progress" id="progressBox">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="bottom-row">
    <button class="reset-btn" id="resetBtn">🔄 重置</button>
    <button class="save-btn" id="saveBtn">💾 保存水印照片</button>
  </div>

  <div class="hint">
    保存后若没弹下载，请按 Ctrl+J / Cmd+J 查看下载记录。<br/>
    建议用 Chrome / Edge / Safari 直接打开本页。
  </div>
</div>

<canvas id="cv"></canvas>
<div class="toast" id="toast"></div>

<script>
  var img = null;
  var isSaving = false;
  var watermarkPos = 'bl';
  var watermarkPreset = 'red';
  var persons = ['现场人员A'];

  var previewImg = document.getElementById('previewImg');
  var addedBadge = document.getElementById('addedBadge');
  var toastEl = document.getElementById('toast');
  var progressBox = document.getElementById('progressBox');
  var progressBar = document.getElementById('progressBar');

  function showToast(msg){
    toastEl.innerText = msg;
    toastEl.style.display = 'block';
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){
      toastEl.style.display = 'none';
    }, 3200);
  }

  function setProgress(v){
    progressBox.style.display = 'block';
    progressBar.style.width = v + '%';
    if(v >= 100){
      setTimeout(function(){
        progressBox.style.display = 'none';
        progressBar.style.width = '0%';
      }, 600);
    }
  }

  function handleFile(file){
    if(!file){
      showToast('❌ 没有选择图片');
      return;
    }

    if(file.size > 12 * 1024 * 1024){
      showToast('❌ 图片太大，建议小于 12MB');
      return;
    }

    var reader = new FileReader();
    reader.onload = function(e){
      var tmp = new Image();
      tmp.onload = function(){
        img = tmp;
        previewImg.src = e.target.result;
        addedBadge.style.display = 'block';
        showToast('✅ 图片已加载');
        tryGetWeather();
      };
      tmp.onerror = function(){
        showToast('❌ 图片读取失败');
      };
      tmp.src = e.target.result;
    };
    reader.onerror = function(){
      showToast('❌ 文件读取错误');
    };
    reader.readAsDataURL(file);
  }

  document.getElementById('cameraInput').addEventListener('change', function(e){
    handleFile(e.target.files[0]);
  });

  document.getElementById('albumInput').addEventListener('change', function(e){
    handleFile(e.target.files[0]);
  });

  document.querySelectorAll('.tab').forEach(function(tab){
    tab.addEventListener('click', function(){
      document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
      document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('active'); });
      tab.classList.add('active');
      document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
    });
  });

  document.querySelectorAll('.pos-item').forEach(function(item){
    item.addEventListener('click', function(){
      document.querySelectorAll('.pos-item').forEach(function(i){ i.classList.remove('active'); });
      item.classList.add('active');
      watermarkPos = item.dataset.pos;
    });
  });

  document.querySelectorAll('.preset-item').forEach(function(item){
    item.addEventListener('click', function(){
      document.querySelectorAll('.preset-item').forEach(function(i){ i.classList.remove('active'); });
      item.classList.add('active');
      watermarkPreset = item.dataset.preset;
    });
  });

  function bindRange(id, valId, suffix, onChange){
    var el = document.getElementById(id);
    var out = document.getElementById(valId);
    el.addEventListener('input', function(){
      out.innerText = el.value + suffix;
      if(onChange) onChange(el.value);
    });
  }

  bindRange('fontSizeRange', 'fontSizeVal', 'px');
  bindRange('opacityRange', 'opacityVal', '%');
  bindRange('radiusRange', 'radiusVal', 'px');

  document.getElementById('customTimeChk').addEventListener('change', function(e){
    document.getElementById('timeInput').style.display = e.target.checked ? 'block' : 'none';
  });

  function renderPersons(){
    var box = document.getElementById('personList');
    box.innerHTML = '';
    persons.forEach(function(name, index){
      var div = document.createElement('div');
      div.className = 'person-item';
      div.innerHTML = '<span>' + name + '</span>';
      var btn = document.createElement('button');
      btn.className = 'small-btn';
      btn.innerText = '删除';
      btn.onclick = function(){
        persons.splice(index, 1);
        renderPersons();
      };
      div.appendChild(btn);
      box.appendChild(div);
    });
  }

  renderPersons();

  document.getElementById('addPersonBtn').addEventListener('click', function(){
    var v = document.getElementById('personName').value.trim();
    if(!v){
      showToast('请输入姓名');
      return;
    }
    persons.push(v);
    document.getElementById('personName').value = '';
    renderPersons();
  });

  document.getElementById('resetBtn').addEventListener('click', function(){
    document.getElementById('project').value = '磐石流量-现场';
    document.getElementById('note').value = '';
    document.getElementById('placeInput').value = '';
    document.getElementById('timeInput').value = '';
    document.getElementById('customTimeChk').checked = false;
    document.getElementById('timeInput').style.display = 'none';
    previewImg.src = '';
    img = null;
    addedBadge.style.display = 'none';
    persons = ['现场人员A'];
    renderPersons();
    showToast('已重置');
  });

  function getNow(){
    var input = document.getElementById('timeInput').value;
    if(document.getElementById('customTimeChk').checked && input){
      return new Date(input.replace('T', ' '));
    }
    return new Date();
  }

  function fmtTime(now){
    var showSec = document.getElementById('advSeconds').checked;
    var pad = function(n){ return n < 10 ? '0' + n : n; };
    var s = now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate())
      + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes());
    if(showSec){
      s += ':' + pad(now.getSeconds());
    }
    return s;
  }

  function tryGetWeather(){
    var place = document.getElementById('placeInput').value;
    if(!document.getElementById('autoWeather').checked && !document.getElementById('advWeather').checked){
      return;
    }

    if(navigator.geolocation && document.getElementById('advLocation').checked){
      navigator.geolocation.getCurrentPosition(function(pos){
        fetchWeather(pos.coords.latitude, pos.coords.longitude);
      }, function(){
        if(place){
          showToast('定位失败，可手动确认地点');
        }
      });
    }
  }

  function fetchWeather(lat, lon){
    fetch('https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon + '&current=temperature_2m,weather_code&timezone=auto')
      .then(function(r){ return r.json(); })
      .then(function(data){
        if(data && data.current){
          var t = data.current.temperature_2m;
          var code = data.current.weather_code;
          var desc = weatherDesc(code);
          var text = desc + ' ' + Math.round(t) + '℃';
          document.getElementById('weatherText').innerText = text;
        }
      })
      .catch(function(){
        document.getElementById('weatherText').innerText = '天气获取失败';
      });
  }

  function weatherDesc(code){
    if(code === 0) return '晴';
    if(code === 1 || code === 2) return '多云';
    if(code === 3) return '阴';
    if(code >= 45 && code <= 48) return '雾';
    if(code >= 51 && code <= 67) return '雨';
    if(code >= 71 && code <= 77) return '雪';
    if(code >= 80 && code <= 82) return '阵雨';
    if(code >= 95) return '雷阵雨';
    return '天气';
  }

  document.getElementById('saveBtn').addEventListener('click', saveImage);

  function saveImage(){
    if(isSaving) return;
    if(!img){
      showToast('❌ 请先拍照或选择相册图片');
      return;
    }

    isSaving = true;
    setProgress(10);

    var cv = document.getElementById('cv');
    var ctx = cv.getContext('2d');

    var MAX_DIM = 2800;
    var scale = Math.min(1, MAX_DIM / Math.max(img.width, img.height));
    cv.width = Math.max(1, Math.round(img.width * scale));
    cv.height = Math.max(1, Math.round(img.height * scale));

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(img, 0, 0, cv.width, cv.height);

    setProgress(35);

    var now = getNow();
    var lines = [];

    if(document.getElementById('f-project').checked){
      lines.push(document.getElementById('project').value || '磐石流量-现场');
    }

    if(document.getElementById('f-time').checked){
      lines.push(fmtTime(now));
    }

    if(document.getElementById('f-date').checked || document.getElementById('f-week').checked){
      var dateWeek = '';
      if(document.getElementById('f-date').checked){
        dateWeek += now.getFullYear() + '-' + pad2(now.getMonth()+1) + '-' + pad2(now.getDate());
      }
      if(document.getElementById('f-week').checked){
        var weekArr = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
        dateWeek += (dateWeek ? ' ' : '') + weekArr[now.getDay()];
      }
      if(dateWeek) lines.push(dateWeek);
    }

    if(document.getElementById('f-place').checked){
      var place = document.getElementById('placeInput').value;
      if(place) lines.push('📍 ' + place);
    }

    if(document.getElementById('f-weather').checked){
      var wt = document.getElementById('weatherText').innerText;
      if(wt && wt !== '未获取' && wt !== '天气获取失败'){
        lines.push('🌡️ ' + wt);
      }
    }

    if(document.getElementById('f-note').checked){
      var note = document.getElementById('note').value;
      if(note) lines.push(note);
    }

    if(document.getElementById('f-cert').checked || document.getElementById('advCert').checked){
      lines.push('✅ 官方认证标');
    }

    if(persons.length && document.getElementById('panel-person')){
      lines.push('人员：' + persons.join('、'));
    }

    if(lines.length === 0){
      lines.push('磐石水印');
    }

    var fontSize = parseInt(document.getElementById('fontSizeRange').value, 10);
    var opacity = parseInt(document.getElementById('opacityRange').value, 10) / 100;
    var radius = parseInt(document.getElementById('radiusRange').value, 10);

    var scaleFont = fontSize * (cv.width / 480);
    var pad = Math.max(18, cv.width * 0.018);
    var lineH = scaleFont * 1.55;
    var boxW = Math.max(cv.width * 0.34, 200);
    var boxH = lines.length * lineH + pad * 2;

    var x = pad;
    var y = cv.height - pad - boxH;

    if(watermarkPos === 'tl'){
      x = pad; y = pad;
    } else if(watermarkPos === 'tr'){
      x = cv.width - pad - boxW; y = pad;
    } else if(watermarkPos === 'br'){
      x = cv.width - pad - boxW; y = cv.height - pad - boxH;
    } else {
      x = pad; y = cv.height - pad - boxH;
    }

    var style = getPresetStyle(watermarkPreset);

    ctx.save();

    if(radius > 0){
      roundRect(ctx, x, y, boxW, boxH, radius);
      ctx.fillStyle = style.bg.replace('ALPHA', opacity);
      ctx.fill();
    } else {
      ctx.fillStyle = style.bg.replace('ALPHA', opacity);
      ctx.fillRect(x, y, boxW, boxH);
    }

    if(document.getElementById('f-redbar').checked && style.bar){
      ctx.fillStyle = style.bar;
      ctx.fillRect(x, y, Math.max(5, cv.width * 0.006), boxH);
    }

    ctx.fillStyle = style.text;
    ctx.font = 'bold ' + scaleFont + 'px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textBaseline = 'middle';

    lines.forEach(function(line, i){
      ctx.fillText(line, x + pad, y + pad + i * lineH + lineH / 2);
    });

    ctx.restore();

    setProgress(70);

    var filename = '磐石水印_' + Date.now() + '.jpg';

    try {
      if(cv.toBlob){
        cv.toBlob(function(blob){
          if(!blob){
            fallbackDataURL();
            return;
          }
          var url = URL.createObjectURL(blob);
          triggerDownload(url, filename);
          setTimeout(function(){
            URL.revokeObjectURL(url);
          }, 6000);
        }, 'image/jpeg', 0.92);
      } else {
        fallbackDataURL();
      }
    } catch(e){
      fallbackDataURL();
    }

    function triggerDownload(url, name){
      var a = document.createElement('a');
      a.href = url;
      a.download = name;
      a.rel = 'noopener';
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setProgress(100);
      showToast('✅ 保存成功，请查看下载/Ctrl+J');
      isSaving = false;
    }

    function fallbackDataURL(){
      try {
        var dataURL = cv.toDataURL('image/jpeg', 0.92);
        triggerDownload(dataURL, filename);
      } catch(err){
        showToast('❌ 保存失败：' + (err.message || '浏览器不支持'));
        isSaving = false;
        setProgress(0);
      }
    }
  }

  function getPresetStyle(preset){
    if(preset === 'black'){
      return { bg: 'rgba(0,0,0,ALPHA)', bar: null, text: '#ffffff' };
    }
    if(preset === 'gold'){
      return { bg: 'rgba(20,14,5,ALPHA)', bar: '#ffd66b', text: '#ffe9a8' };
    }
    if(preset === 'white'){
      return { bg: 'rgba(255,255,255,ALPHA)', bar: null, text: '#111111' };
    }
    return { bg: 'rgba(0,0,0,ALPHA)', bar: '#ff4d4d', text: '#ffffff' };
  }

  function roundRect(ctx, x, y, w, h, r){
    var radius = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.lineTo(x + w - radius, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
    ctx.lineTo(x + w, y + h - radius);
    ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
    ctx.lineTo(x + radius, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
    ctx.lineTo(x, y + radius);
    ctx.quadraticCurveTo(x, y, x + radius, y);
    ctx.closePath();
  }

  function pad2(n){
    return n < 10 ? '0' + n : n;
  }
</script>
