<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>磐石水印相机 v8.0</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;
padding:12px;

background:#111827;

color:white;

font-family:
-apple-system,
BlinkMacSystemFont,
"Microsoft YaHei",
Arial;

}



.app{

display:flex;

gap:12px;

height:96vh;

}



.panel{

width:340px;

background:#1f2937;

border-radius:12px;

padding:15px;

overflow:auto;

}



.preview{

flex:1;

background:#000;

border-radius:12px;

position:relative;

overflow:hidden;

display:flex;

align-items:center;

justify-content:center;

}



canvas{

max-width:100%;

max-height:100%;

}



.title{

font-size:20px;

font-weight:bold;

margin-bottom:15px;

}



input,
button{

width:100%;

margin-top:8px;

padding:10px;

border-radius:8px;

border:1px solid #374151;

background:#111827;

color:#fff;

font-size:14px;

}



button{

background:#2563eb;

cursor:pointer;

}



.green{

background:#16a34a;

}



.red{

background:#dc2626;

}



.row{

display:flex;

gap:8px;

}



.row input{

width:50%;

}



.search{

position:relative;

}



.list{

position:absolute;

left:0;

right:0;

top:100%;

background:#111827;

z-index:99;

border-radius:8px;

overflow:hidden;

}



.list div{

padding:10px;

border-bottom:1px solid #374151;

cursor:pointer;

}



.list div:hover{

background:#374151;

}




label{

display:block;

font-size:13px;

margin-top:12px;

color:#d1d5db;

}




/* 水印 */

.watermark{

position:absolute;

left:25px;

bottom:25px;


color:white;


font-family:

"Microsoft YaHei",
Arial;


font-weight:500;


line-height:1.15;


letter-spacing:.3px;


white-space:pre-line;


text-shadow:

0 2px 5px rgba(0,0,0,.85);


cursor:move;


max-width:90%;


}



</style>

</head>



<body>


<div class="app">



<div class="panel">



<div class="title">

磐石水印相机 v8.0

</div>




<input
type="file"
id="file"
accept="image/*"
capture="environment">





<div class="search">


<input
id="address"
placeholder="输入中国地点，例如：北京大红门">


<div
id="list"
class="list">

</div>


</div>





<div class="row">


<input
id="lat"
placeholder="纬度">


<input
id="lon"
placeholder="经度">


</div>





<button
id="gps"
class="green">

📍 获取当前位置

</button>




<input
id="weather"
placeholder="天气">




<input
id="temp"
placeholder="温度">





<button
id="getWeather">

☀ 获取天气

</button>





<hr>





<label>

水印大小

</label>


<input
id="waterSize"
type="range"
min="12"
max="60"
value="24">





<label>

水印透明度

</label>


<input
id="waterOpacity"
type="range"
min="20"
max="100"
value="90">





<label>

底部文字（可为空）

</label>


<input
id="brand"
placeholder="例如：磐石课堂">






<button
id="export"
class="red">

📥 导出高清图片

</button>



</div>





<div class="preview">


<canvas
id="canvas">

</canvas>



<div
id="watermark"
class="watermark">

</div>



</div>




</div>


<script>


const file=
document.getElementById("file");


const canvas=
document.getElementById("canvas");


const ctx=
canvas.getContext("2d");



const address=
document.getElementById("address");


const lat=
document.getElementById("lat");


const lon=
document.getElementById("lon");


const list=
document.getElementById("list");


const watermark=
document.getElementById("watermark");



const waterSize=
document.getElementById("waterSize");


const waterOpacity=
document.getElementById("waterOpacity");


const brand=
document.getElementById("brand");



let img=null;



// 上传图片


file.onchange=function(e){


let f=e.target.files[0];


if(!f)return;



let reader=new FileReader();



reader.onload=function(ev){


img=new Image();



img.onload=function(){


canvas.width=img.width;


canvas.height=img.height;


draw();


updateWatermark();


};



img.src=ev.target.result;


};



reader.readAsDataURL(f);


};




function draw(){


if(!img)return;


ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);


ctx.drawImage(
img,
0,
0
);


}
// ===============================
// 中国地址自动联想
// ===============================


let searchTimer=null;



address.oninput=function(){


clearTimeout(searchTimer);



let key=this.value.trim();



if(!key){

list.innerHTML="";

return;

}



searchTimer=setTimeout(async()=>{


try{


let url=

"https://nominatim.openstreetmap.org/search?format=json&accept-language=zh-CN&countrycodes=cn&limit=8&q="
+
encodeURIComponent(key);



let res=
await fetch(url);



let data=
await res.json();



list.innerHTML="";



data.forEach(item=>{



let div=
document.createElement("div");



let name=
formatAddress(
item.display_name
);



div.innerText=name;



div.onclick=function(){


address.value=name;



lat.value=
Number(item.lat).toFixed(6);



lon.value=
Number(item.lon).toFixed(6);



list.innerHTML="";



updateWatermark();



};



list.appendChild(div);



});



}catch(e){


console.log(
"地址搜索失败",
e
);


}



},500);



};







// 地址格式化

function formatAddress(str){


if(!str)return "";



let arr=
str
.replace(/, China/g,"")
.replace(/, 中国/g,"")
.split(",");



let result=[];



arr.forEach(v=>{


let t=v.trim();


if(
t &&
!result.includes(t)
){

result.push(t);

}


});



return result
.slice(0,4)
.join("");



}






// ===============================
// GPS定位
// ===============================


document.getElementById("gps")
.onclick=function(){



if(!navigator.geolocation){


alert(
"浏览器不支持定位"
);


return;

}



navigator.geolocation.getCurrentPosition(

async function(pos){


lat.value=
pos.coords.latitude.toFixed(6);



lon.value=
pos.coords.longitude.toFixed(6);



try{


let url=

"https://nominatim.openstreetmap.org/reverse?format=json&accept-language=zh-CN&lat="
+
lat.value
+
"&lon="
+
lon.value;



let res=
await fetch(url);



let data=
await res.json();



if(data.display_name){


address.value=
formatAddress(
data.display_name
);



}



}catch(e){}



updateWatermark();



},


function(){


alert(
"定位失败"
);


}



);



};








// ===============================
// 天气
// ===============================


document.getElementById("getWeather")
.onclick=
async function(){



if(!lat.value||!lon.value){


alert(
"请先选择地点"
);


return;

}



try{


let url=

`https://api.open-meteo.com/v1/forecast?latitude=${lat.value}&longitude=${lon.value}&current=temperature_2m,wind_speed_10m`;



let res=
await fetch(url);



let data=
await res.json();



let t=
Math.round(
data.current.temperature_2m
);



let wind=
data.current.wind_speed_10m
.toFixed(1);



document.getElementById("weather")
.value=
"☀ 晴 风速"+wind+"m/s";



document.getElementById("temp")
.value=
t+"℃";



updateWatermark();



}catch(e){


document.getElementById("weather")
.value=
"天气未知";


}



};








// ===============================
// 水印生成
// ===============================


function updateWatermark(){



let d=
new Date();



let time=

d.getFullYear()
+
"-"
+
String(d.getMonth()+1).padStart(2,"0")
+
"-"
+
String(d.getDate()).padStart(2,"0")
+
" "
+
String(d.getHours()).padStart(2,"0")
+
":"
+
String(d.getMinutes()).padStart(2,"0");





let locationText=
address.value ||
"";



let weatherText=

document.getElementById("weather")
.value
||
"";



let tempText=

document.getElementById("temp")
.value
||
"";





let content=


time

+
"\n"

+
"📍 "
+
locationText

+
"\n"

+
lat.value
+
"°N "
+
lon.value
+
"°E"

+
"\n"

+
weatherText
+
" "
+
tempText;





let brandText=
brand.value.trim();



if(brandText){


content+=
"\n"
+
brandText;


}



watermark.innerText=
content;




// 大小控制


watermark.style.fontSize=
waterSize.value+"px";




//透明度控制


watermark.style.opacity=
waterOpacity.value/100;



}





//实时刷新


setInterval(
updateWatermark,
1000
);




//滑块监听


waterSize.oninput=
updateWatermark;


waterOpacity.oninput=
updateWatermark;


brand.oninput=
updateWatermark;
  // ===============================
// 水印拖动（电脑+手机）
// ===============================


let dragging=false;

let startX=0;

let startY=0;

let wmX=25;

let wmY=25;



function point(e){

return e.touches?
e.touches[0]:
e;

}



function dragStart(e){


let p=point(e);


dragging=true;


startX=
p.clientX-wmX;


startY=
p.clientY-wmY;



watermark.style.bottom="auto";


}



function dragMove(e){


if(!dragging)return;


let p=point(e);



wmX=
p.clientX-startX;


wmY=
p.clientY-startY;



wmX=Math.max(
0,
wmX
);


wmY=Math.max(
0,
wmY
);



watermark.style.left=
wmX+"px";


watermark.style.top=
wmY+"px";



}



function dragEnd(){

dragging=false;

}



watermark.addEventListener(
"mousedown",
dragStart
);


document.addEventListener(
"mousemove",
dragMove
);


document.addEventListener(
"mouseup",
dragEnd
);




watermark.addEventListener(
"touchstart",
dragStart,
{
passive:true
}
);



document.addEventListener(
"touchmove",
dragMove,
{
passive:true
}
);



document.addEventListener(
"touchend",
dragEnd
);









// ===============================
// 高清导出
// ===============================


document.getElementById("export")
.onclick=function(){



if(!img){


alert(
"请先上传图片"
);


return;

}



// 重绘图片


ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);



ctx.drawImage(
img,
0,
0
);




//显示尺寸比例


let scaleX=
canvas.width/
canvas.clientWidth;



let scaleY=
canvas.height/
canvas.clientHeight;



let x=
watermark.offsetLeft*
scaleX;



let y=
watermark.offsetTop*
scaleY;






// 根据原图自动字体


let fontSize=
Number(waterSize.value)
*
scaleX;



ctx.save();




ctx.font=

`500 ${fontSize}px Microsoft YaHei`;



ctx.fillStyle=

`rgba(255,255,255,${waterOpacity.value/100})`;



ctx.shadowColor=

"rgba(0,0,0,.85)";



ctx.shadowBlur=
fontSize/5;



ctx.textBaseline=
"top";




let lines=
watermark.innerText.split("\n");



let lineHeight=
fontSize*1.2;



lines.forEach(
(line,i)=>{


ctx.fillText(
line,
x,
y+i*lineHeight
);


}

);



ctx.restore();






// 下载图片


let a=
document.createElement("a");



a.download=

"磐石水印_"
+
Date.now()
+
".png";



a.href=
canvas.toDataURL(
"image/png",
1
);



a.click();



};






// ===============================
// 初始化
// ===============================


updateWatermark();



</script>


</body>

</html>
