<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>磐石水印相机 · 修正版</title>
<style>
:root{--gold:#d4af37;--bg:#0b0b0b;--card:#121212;--text:#e8d8a9;}
*{box-sizing:border-box;font-family:"PingFang SC","Microsoft YaHei",sans-serif;}
body{background:var(--bg);color:var(--text);padding:12px;display:flex;justify-content:center;}
.wrap{max-width:420px;width:100%;}
.card{background:var(--card);border:1.5px solid var(--gold);border-radius:18px;padding:16px;}
.title{text-align:center;font-size:20px;font-weight:800;color:var(--gold);}
.sub{text-align:center;font-size:11px;color:#8a7a4a;margin-bottom:14px;}
.preview{width:100%;aspect-ratio:4/3;background:#0a0a0a;border:1px solid rgba(212,175,55,.25);border-radius:12px;overflow:hidden;margin-bottom:14px;display:flex;align-items:center;justify-content:center;}
.preview img{width:100%;height:100%;object-fit:contain;}
.field{margin-bottom:12px;}
label{font-size:13px;color:var(--gold);display:block;margin-bottom:5px;}
input,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid rgba(212,175,55,.35);background:#0f0f0f;color:var(--text);font-size:14px;}
.check{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px;}
.presets{display:flex;gap:8px;margin-bottom:12px;}
.preset{padding:6px 10px;border-radius:8px;border:1px solid rgba(212,175,55,.35);font-size:12px;cursor:pointer;}
.preset.active{border-color:var(--gold);color:var(--gold);}
.slider{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.slider input[type=range]{flex:1;accent-color:var(--gold);}
.btn{width:100%;padding:13px;border-radius:12px;border:none;font-size:15px;font-weight:800;cursor:pointer;margin-top:10px;}
.save{background:linear-gradient(135deg,var(--gold),#f9e7a0);color:#1a1a1a;}
.hint{font-size:11px;color:#8a7a4a;text-align:center;margin-top:8px;}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:var(--gold);padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:999;}
.toast.show{opacity:1;}
canvas{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="title">磐石水印相机</div>
    <div class="sub">字段对齐 · 黑框自适应 · 认证标可控</div>

    <div class="preview" id="preview">请选择照片</div>
    <input type="file" id="file" accept="image/*" style="display:none">
    <button class="btn" onclick="document.getElementById('file').click()">📷 拍照 / 相册</button>

    <div class="field">
      <label>项目名称</label>
      <input id="project" value="磐石流量-现场">
    </div>
    <div class="field">
      <label>地点</label>
      <input id="place" value="朝阳区, 北京市">
    </div>
    <div class="field">
      <label>备注</label>
      <textarea id="note">设备运行正常</textarea>
    </div>

    <div class="check">
      <input type="checkbox" id="cert">
      <label for="cert">官方认证标（唯一开关）</label>
    </div>
    <div class="check">
      <input type="checkbox" id="weather" checked>
      <label for="weather">显示天气</label>
    </div>

    <div class="presets">
      <div class="preset active" onclick="setPreset('red')">经典红条</div>
      <div class="preset" onclick="setPreset('dark')">半透黑底</div>
      <div class="preset" onclick="setPreset('white')">白底黑字</div>
    </div>

    <div class="slider">
      <label>字号</label>
      <input type="range" id="font" min="14" max="36" value="22">
    </div>

    <button class="btn save" onclick="save()">💾 保存水印照片</button>
    <div class="hint">PC：新窗口 → 右键另存为<br>手机：长按保存</div>
  </div>
</div>

<div class="toast" id="toast"></div>
<canvas id="cv"></canvas>

<script>
var img=null;
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
document.getElementById('file').onchange=e=>{
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();r.onload=ev=>{img=new Image();img.onload=()=>document.getElementById('preview').innerHTML='<img src="'+ev.target.result+'">';img.src=ev.target.result;};r.readAsDataURL(f);
};

var preset='red';
function setPreset(p){preset=p;document.querySelectorAll('.preset').forEach(x=>x.classList.remove('active'));event.target.classList.add('active');}

function getStyle(){
  var op=0.72;
  if(preset==='white')return{bg:'rgba(255,255,255,'+op+')',bar:null,text:'#111'};
  if(preset==='dark')return{bg:'rgba(0,0,0,'+op+')',bar:null,text:'#fff'};
  return{bg:'rgba(0,0,0,'+op+')',bar:'#ff4d4d',text:'#fff'};
}

function roundRect(ctx,x,y,w,h,r){
  var rd=Math.min(r,w/2,h/2);
  ctx.beginPath();ctx.moveTo(x+rd,y);ctx.lineTo(x+w-rd,y);ctx.quadraticCurveTo(x+w,y,x+w,y+rd);
  ctx.lineTo(x+w,y+h-rd);ctx.quadraticCurveTo(x+w,y+h,x+w-rd,y+h);
  ctx.lineTo(x+rd,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-rd);
  ctx.lineTo(x,y+rd);ctx.quadraticCurveTo(x,y,x+rd,y);ctx.closePath();ctx.fill();
}

async function save(){
  if(!img){toast('❌ 请先选图');return;}
  var cv=document.getElementById('cv');
  var scale=Math.min(1,2800/Math.max(img.width,img.height));
  cv.width=img.width*scale;cv.height=img.height*scale;
  var ctx=cv.getContext('2d');
  ctx.drawImage(img,0,0,cv.width,cv.height);

  var now=new Date();
  var lines=[
    document.getElementById('project').value,
    now.toLocaleString('zh-CN'),
    document.getElementById('place').value,
    document.getElementById('note').value
  ].filter(Boolean);

  if(document.getElementById('cert').checked)lines.push('✅ 官方认证标');

  var fontSize=parseInt(document.getElementById('font').value);
  var sf=fontSize*(cv.width/420);
  var pad=20,lh=sf*1.6;
  ctx.font='bold '+sf+'px sans-serif';
  var maxW=0;
  lines.forEach(l=>maxW=Math.max(maxW,ctx.measureText(l).width));
  var boxW=maxW+pad*2;
  var boxH=lines.length*lh+pad*2;
  var x=pad,y=cv.height-pad-boxH;

  var s=getStyle();
  ctx.save();
  roundRect(ctx,x,y,boxW,boxH,10);
  ctx.fillStyle=s.bg;ctx.fill();
  if(s.bar){ctx.fillStyle=s.bar;ctx.fillRect(x,y,6,boxH);}
  ctx.fillStyle=s.text;
  lines.forEach((l,i)=>ctx.fillText(l,x+pad,y+pad+i*lh+lh/2));
  ctx.restore();

  var win=window.open();
  win.document.write('<img src="'+cv.toDataURL('image/jpeg',0.92)+'" style="max-width:100%">');
  toast('✅ 已打开新窗口，右键保存');
}
</script>
</body>
</html>
